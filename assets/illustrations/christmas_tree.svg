<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="220" height="280" role="img" aria-label="Christmas Tree with Lights">
  <defs>
    <!-- Evergreen foliage gradients -->
    <linearGradient id="treeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6e37"/>
      <stop offset="55%" stop-color="#145227"/>
      <stop offset="100%" stop-color="#0b3618"/>
    </linearGradient>
    <linearGradient id="treeMid" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2b8746"/>
      <stop offset="60%" stop-color="#18612e"/>
      <stop offset="100%" stop-color="#0f421e"/>
    </linearGradient>
    <linearGradient id="treeLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#369e54"/>
      <stop offset="65%" stop-color="#1e7036"/>
      <stop offset="100%" stop-color="#124d23"/>
    </linearGradient>

    <!-- Gold topper star and garland gradients -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#f2c424"/>
      <stop offset="100%" stop-color="#b87c08"/>
    </linearGradient>
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe95c" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#ffd22e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd22e" stop-opacity="0"/>
    </radialGradient>

    <!-- Trunk and stand gradients -->
    <linearGradient id="trunkWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a2c14"/>
      <stop offset="45%" stop-color="#704422"/>
      <stop offset="100%" stop-color="#3b220e"/>
    </linearGradient>
    <linearGradient id="standGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c6823"/>
      <stop offset="50%" stop-color="#e3c559"/>
      <stop offset="100%" stop-color="#7a5819"/>
    </linearGradient>

    <!-- Light bulb radial glow halos -->
    <radialGradient id="glowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8b8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd54f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a80" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff1744" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#82b1ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#2979ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2979ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b9f6ca" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#00e676" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tree stand and trunk -->
  <path d="M 78,266 L 86,254 L 134,254 L 142,266 Z" fill="url(#standGold)"/>
  <rect x="82" y="253" width="56" height="4" rx="2" fill="#9c7528"/>
  <rect x="97" y="232" width="26" height="23" rx="2" fill="url(#trunkWood)"/>

  <!-- Tier 4 (Bottom boughs) -->
  <path d="M 110,152
           C 84,182 54,208 24,228
           C 38,233 52,231 64,227
           C 78,235 94,236 110,233
           C 126,236 142,235 156,227
           C 168,231 182,233 196,228
           C 166,208 136,182 110,152 Z"
        fill="url(#treeDark)"/>

  <!-- Tier 3 (Lower-middle boughs) -->
  <path d="M 110,108
           C 86,136 62,160 38,180
           C 50,185 63,183 74,179
           C 86,186 98,187 110,184
           C 122,187 134,186 146,179
           C 157,183 170,185 182,180
           C 158,160 134,136 110,108 Z"
        fill="url(#treeMid)"/>

  <!-- Tier 2 (Upper-middle boughs) -->
  <path d="M 110,68
           C 90,92 70,114 52,132
           C 63,137 74,135 83,131
           C 92,137 101,138 110,136
           C 119,138 128,137 137,131
           C 146,135 157,137 168,132
           C 150,114 130,92 110,68 Z"
        fill="url(#treeLight)"/>

  <!-- Tier 1 (Top crown boughs) -->
  <path d="M 110,34
           C 96,54 82,72 68,88
           C 77,92 86,90 94,87
           C 100,91 105,92 110,90
           C 115,92 120,91 126,87
           C 134,90 143,92 152,88
           C 138,72 124,54 110,34 Z"
        fill="url(#treeLight)"/>

  <!-- Decorative gold garland ribbons -->
  <path d="M 80,76 Q 110,92 142,80" fill="none" stroke="#f0d059" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M 64,120 Q 112,142 158,122" fill="none" stroke="#f0d059" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 50,168 Q 110,194 170,170" fill="none" stroke="#f0d059" stroke-width="3.0" stroke-linecap="round" opacity="0.9"/>
  <path d="M 36,216 Q 110,244 184,216" fill="none" stroke="#f0d059" stroke-width="3.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Dark green wire strands for Christmas lights -->
  <path d="M 84,68 Q 110,80 136,68" fill="none" stroke="#0a2e14" stroke-width="1.2"/>
  <path d="M 68,108 Q 110,126 152,110" fill="none" stroke="#0a2e14" stroke-width="1.3"/>
  <path d="M 54,154 Q 110,176 166,156" fill="none" stroke="#0a2e14" stroke-width="1.4"/>
  <path d="M 40,202 Q 110,228 180,204" fill="none" stroke="#0a2e14" stroke-width="1.5"/>

  <!-- Classic glass ornaments -->
  <g>
    <circle cx="96" cy="102" r="5.2" fill="#c62828"/>
    <circle cx="94.3" cy="100.3" r="1.5" fill="#ffcdd2" opacity="0.8"/>
    <circle cx="128" cy="146" r="5.8" fill="#1e47c7"/>
    <circle cx="126.2" cy="144.2" r="1.6" fill="#bbdefb" opacity="0.85"/>
    <circle cx="82" cy="158" r="5.5" fill="#e0b422"/>
    <circle cx="80.2" cy="156.2" r="1.5" fill="#fff9c4" opacity="0.85"/>
    <circle cx="144" cy="196" r="6.2" fill="#c62828"/>
    <circle cx="142" cy="194" r="1.7" fill="#ffcdd2" opacity="0.8"/>
    <circle cx="72" cy="206" r="6.0" fill="#1e47c7"/>
    <circle cx="70" cy="204" r="1.7" fill="#bbdefb" opacity="0.85"/>
    <circle cx="110" cy="192" r="5.6" fill="#e0b422"/>
    <circle cx="108.3" cy="190.3" r="1.5" fill="#fff9c4" opacity="0.85"/>
  </g>

  <!-- Glowing Christmas Lights (halos + bright bulb cores) -->
  <g>
    <!-- Tier 1 lights -->
    <circle cx="92" cy="72" r="8" fill="url(#glowWarm)"/>
    <circle cx="92" cy="72" r="2.6" fill="#fffde7"/>
    <circle cx="110" cy="75" r="8" fill="url(#glowRed)"/>
    <circle cx="110" cy="75" r="2.6" fill="#ff5252"/>
    <circle cx="128" cy="72" r="8" fill="url(#glowBlue)"/>
    <circle cx="128" cy="72" r="2.6" fill="#448aff"/>

    <!-- Tier 2 lights -->
    <circle cx="74" cy="112" r="8.5" fill="url(#glowRed)"/>
    <circle cx="74" cy="112" r="2.8" fill="#ff5252"/>
    <circle cx="96" cy="118" r="8.5" fill="url(#glowWarm)"/>
    <circle cx="96" cy="118" r="2.8" fill="#fffde7"/>
    <circle cx="120" cy="119" r="8.5" fill="url(#glowEmerald)"/>
    <circle cx="120" cy="119" r="2.8" fill="#69f0ae"/>
    <circle cx="144" cy="113" r="8.5" fill="url(#glowWarm)"/>
    <circle cx="144" cy="113" r="2.8" fill="#fffde7"/>

    <!-- Tier 3 lights -->
    <circle cx="58" cy="157" r="9" fill="url(#glowBlue)"/>
    <circle cx="58" cy="157" r="3.0" fill="#448aff"/>
    <circle cx="84" cy="166" r="9" fill="url(#glowWarm)"/>
    <circle cx="84" cy="166" r="3.0" fill="#fffde7"/>
    <circle cx="110" cy="168" r="9" fill="url(#glowRed)"/>
    <circle cx="110" cy="168" r="3.0" fill="#ff5252"/>
    <circle cx="136" cy="166" r="9" fill="url(#glowWarm)"/>
    <circle cx="136" cy="166" r="3.0" fill="#fffde7"/>
    <circle cx="160" cy="158" r="9" fill="url(#glowEmerald)"/>
    <circle cx="160" cy="158" r="3.0" fill="#69f0ae"/>

    <!-- Tier 4 lights -->
    <circle cx="44" cy="205" r="9.5" fill="url(#glowWarm)"/>
    <circle cx="44" cy="205" r="3.2" fill="#fffde7"/>
    <circle cx="72" cy="215" r="9.5" fill="url(#glowRed)"/>
    <circle cx="72" cy="215" r="3.2" fill="#ff5252"/>
    <circle cx="98" cy="220" r="9.5" fill="url(#glowBlue)"/>
    <circle cx="98" cy="220" r="3.2" fill="#448aff"/>
    <circle cx="124" cy="220" r="9.5" fill="url(#glowWarm)"/>
    <circle cx="124" cy="220" r="3.2" fill="#fffde7"/>
    <circle cx="150" cy="215" r="9.5" fill="url(#glowEmerald)"/>
    <circle cx="150" cy="215" r="3.2" fill="#69f0ae"/>
    <circle cx="176" cy="206" r="9.5" fill="url(#glowRed)"/>
    <circle cx="176" cy="206" r="3.2" fill="#ff5252"/>
  </g>

  <!-- Gold Star Topper with soft glow -->
  <circle cx="110" cy="26" r="24" fill="url(#starHalo)"/>
  <polygon points="110,9 114.8,20.2 127,21.3 117.7,29.3 120.5,41.2 110,34.8 99.5,41.2 102.3,29.3 93,21.3 105.2,20.2"
           fill="url(#starGold)" stroke="#9c6a06" stroke-width="0.8" stroke-linejoin="round"/>
</svg>